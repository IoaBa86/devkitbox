[project]
name = "devkitbox"
version = "1.0.0"
description = "Your Developer Toolbox for Windows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "DevKitBox" }]

dependencies = [
    "PySide6>=6.7.0",
    "regex>=2024.4.16",
    "PyYAML>=6.0",
    "qrcode>=7.4",
    "sqlparse>=0.5",
    "cryptography>=42.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.6.0",
    "pyinstaller>=6.10.0",
]

[project.scripts]
devkitbox = "app.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
